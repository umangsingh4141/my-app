<div class="crud-container">
  <h2>Employee Management</h2>

  <!-- Add Employee Form -->
  <div class="add-form">
    <h3>Add New Employee</h3>
    <div class="form-group">
      <input [(ngModel)]="newEmployee.name" placeholder="Name" required>
      <input [(ngModel)]="newEmployee.email" type="email" placeholder="Email" required>
      <select [(ngModel)]="newEmployee.department" required>
        <option value="">Select Department</option>
        @for (dept of departments; track dept) {
          <option [value]="dept">{{dept}}</option>
        }
      </select>
      <input [(ngModel)]="newEmployee.salary" type="number" placeholder="Salary" required>
      <button (click)="addEmployee()">Add Employee</button>
    </div>
  </div>

  <!-- Employees Table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (employee of employees; track employee.id) {
        @if (editingEmployee?.id === employee.id) {
          <tr>
            <td>{{employee.id}}</td>
            <td><input [ngModel]="editingEmployee!.name" (ngModelChange)="editingEmployee!.name = $event"></td>
            <td><input [ngModel]="editingEmployee!.email" (ngModelChange)="editingEmployee!.email = $event"></td>
            <td>
              <select [ngModel]="editingEmployee!.department" (ngModelChange)="editingEmployee!.department = $event">
                @for (dept of departments; track dept) {
                  <option [value]="dept">{{dept}}</option>
                }
              </select>
            </td>
            <td><input [ngModel]="editingEmployee!.salary" (ngModelChange)="editingEmployee!.salary = $event" type="number"></td>
            <td>
              <button (click)="updateEmployee()">Save</button>
              <button (click)="cancelEdit()">Cancel</button>
            </td>
          </tr>
        } @else {
          <tr>
            <td>{{employee.id}}</td>
            <td>{{employee.name}}</td>
            <td>{{employee.email}}</td>
            <td>{{employee.department}}</td>
            <td>{{employee.salary}}</td>
            <td>
              <button (click)="editEmployee(employee)">Edit</button>
              <button (click)="deleteEmployee(employee.id)">Delete</button>
            </td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
